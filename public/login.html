<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Panel Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0a0e13, #0f1419);
    }
    .login-card {
      background: linear-gradient(135deg, var(--bg-dark), #0d1419);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--accent-blue);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(22, 48, 43, 0.6);
    }
    h2 { color: var(--accent-copper); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center">Acceso al Panel Administrativo</h2>

    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="user" class="form-label" style="color: var(--text-secondary);">Usuario</label>
        <input type="text" class="form-control" id="user" required />
      </div>
      <div class="mb-3">
        <label for="pass" class="form-label" style="color: var(--text-secondary);">Contraseña</label>
        <input type="password" class="form-control" id="pass" required />
      </div>
      <button type="submit" class="btn btn-submit w-100">Iniciar sesión</button>
    </form>
    <div class="mt-3 text-center" style="font-size: 13px; color: var(--text-secondary);">
      Credenciales por defecto: <strong>admin / admin123</strong>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('user').value;
      const clave = document.getElementById('pass').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, clave })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', usuario);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.message;
          errorMsg.classList.remove('d-none');
        }
      } catch (err) {
        errorMsg.textContent = 'Error al conectar con el servidor';
        errorMsg.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
