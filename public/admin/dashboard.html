<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Turnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0f1419;
        --bg-darker: #080d12;
        --bg-card: rgba(22, 48, 43, 0.92);
        --bg-card-soft: rgba(15, 20, 25, 0.85);
        --accent: #d4a574;
        --accent-soft: #b8860b;
        --text: #f1f1f1;
        --text-muted: #b8b8b8;
        --border: rgba(212, 165, 116, 0.16);
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        --radius: 18px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, var(--bg-darker) 0%, var(--bg-dark) 45%, #0d1820 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at top right, rgba(212,165,116,0.14), transparent 22%), radial-gradient(circle at 30% 40%, rgba(255,255,255,0.05), transparent 20%);
        pointer-events: none;
        z-index: -1;
      }
      .container-fluid {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }
      .header {
        background: rgba(10, 14, 19, 0.88);
        border: 1px solid rgba(212, 165, 116, 0.14);
        border-radius: 20px;
        padding: 24px 28px;
        box-shadow: var(--shadow);
        color: var(--text);
      }
      .header h1 {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-size: 1.85rem;
        letter-spacing: 2px;
      }
      .header .text-light {
        color: var(--text-muted);
      }
      .btn-danger {
        background: linear-gradient(135deg, var(--accent), var(--accent-soft));
        border: none;
        color: #081014;
        font-weight: 700;
      }
      #alertMsg {
        margin: 22px 0;
        padding: 18px 22px;
        border-radius: 18px;
        border: 1px solid rgba(212,165,116,0.25);
        background: rgba(22,48,43,0.92);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .alert-danger { border-color: rgba(217,83,79,0.35); background: rgba(217,83,79,0.12); color: #f8d7da; }
      .alert-success { border-color: rgba(40,167,69,0.35); background: rgba(40,167,69,0.12); color: #d4f1d4; }
      .stat-card {
        background: rgba(10, 14, 19, 0.85);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 24px 20px;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }
      .stat-card:hover {
        transform: translateY(-4px);
        border-color: rgba(212,165,116,0.35);
      }
      .stat-number {
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--accent);
      }
      .stat-label {
        margin-top: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 18px;
        align-items: center;
      }
      .toolbar .form-control {
        min-width: 260px;
        max-width: 420px;
        background: rgba(10,14,19,0.95);
        border: 1px solid rgba(212,165,116,0.18);
        color: var(--text);
      }
      .toolbar .form-control::placeholder {
        color: rgba(241,241,241,0.55);
      }
      .toolbar .form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(212,165,116,0.12);
        background: rgba(10,14,19,1);
      }
      .toolbar .btn-secondary {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(212,165,116,0.18);
        color: var(--text);
      }
      .toolbar .btn-secondary:hover {
        background: rgba(212,165,116,0.16);
      }
      .filter-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 22px;
      }
      .filter-btn {
        border: 1px solid rgba(212,165,116,0.22);
        background: rgba(10,14,19,0.82);
        color: var(--text);
        border-radius: 999px;
        padding: 12px 18px;
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .filter-btn:hover {
        transform: translateY(-1px);
        background: rgba(212,165,116,0.14);
      }
      .btn-outline-success {
        color: var(--text);
        border-color: rgba(212,165,116,0.25);
        background: rgba(255,255,255,0.04);
      }
      .btn-outline-success:hover {
        background: rgba(212,165,116,0.18);
        border-color: rgba(212,165,116,0.35);
      }
      .filter-btn.active,
      .filter-btn.btn-success {
        background: linear-gradient(135deg, var(--accent), rgba(212,165,116,0.18));
        color: #081014;
        border-color: rgba(212,165,116,0.4);
      }
      .table-wrapper {
        background: rgba(10,14,19,0.92);
        border: 1px solid rgba(212,165,116,0.16);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .table-wrapper table {
        min-width: 100%;
        color: var(--text);
        background-color: transparent;
      }
      .table-wrapper .table {
        color: var(--text) !important;
      }
      .table-wrapper .table > :not(caption) > * > * {
        background-color: transparent !important;
      }
      .table-wrapper tbody tr,
      .table-wrapper .table-striped > tbody > tr:nth-of-type(odd),
      .table-wrapper .table-striped > tbody > tr:nth-of-type(even) {
        background: rgba(255,255,255,0.04) !important;
      }
      .table-wrapper th,
      .table-wrapper td {
        padding: 16px 14px;
        vertical-align: middle;
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      .table-wrapper th {
        background: rgba(22,48,43,0.95);
        color: var(--text-muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .table-wrapper tbody tr {
        transition: background 0.25s ease;
        background: rgba(255,255,255,0.04);
      }
      .table-wrapper tbody tr:nth-of-type(odd) {
        background: rgba(255,255,255,0.03);
      }
      .table-wrapper tbody tr td,
      .table-wrapper tbody tr th {
        color: var(--text);
      }
      .table-wrapper tbody tr:hover {
        background: rgba(212,165,116,0.16);
      }
      .table-wrapper .table-striped > tbody > tr:nth-of-type(odd) {
        background: rgba(255,255,255,0.03);
      }
      .table-wrapper .table-striped > tbody > tr:nth-of-type(even) {
        background: rgba(255,255,255,0.02);
      }
      .table-wrapper .btn-danger {
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
      }
      .table-wrapper .text-center {
        color: var(--text-muted);
      }
      @media (max-width: 992px) {
        .toolbar { flex-direction: column; align-items: stretch; }
        .filter-group { justify-content: flex-start; }
      }
      @media (max-width: 768px) {
        .container-fluid { padding: 20px 16px 32px; }
        .header { padding: 20px; }
        .stat-card { padding: 20px; }
        .table-wrapper th, .table-wrapper td { padding: 12px 10px; }
      }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="m-0 fs-4">🏪 Panel Administrativo - Turnos</h1>
                <div class="text-light" style="font-size: 14px;">Bienvenido, <strong id="adminName">Admin</strong></div>
            </div>
            <button onclick="logout()" class="btn btn-danger">Cerrar Sesión</button>
        </div>
        
        <div id="alertMsg" class="alert d-none" role="alert"></div>
        
        <!-- Estadísticas -->
        <div class="row g-3 mb-4" id="statsContainer">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Total de Turnos</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statHoy">0</div>
                    <div class="stat-label">Turnos Hoy</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statEfectivo">0</div>
                    <div class="stat-label">Pagos en Efectivo</div>
                </div>
            </div>
        </div>
        
        <!-- Toolbar -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <input type="search" id="searchInput" class="form-control w-auto flex-grow-1" placeholder="🔍 Buscar por nombre o teléfono...">
            <button class="btn btn-secondary" onclick="loadTurnos()">🔄 Refrescar</button>
        </div>
        
        <!-- Filtros de barbero -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-outline-success active filter-btn" onclick="filtrarPorBarbero('todos', this)">Todos</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('samuel', this)">Samuel</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('ale', this)">Ale</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('alexis', this)">Alexis</button>
        </div>
        
        <!-- Tabla de turnos -->
        <div class="table-wrapper">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th class="d-none">ID</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Servicio</th>
                        <th>Barbero</th>
                        <th>Pago</th>
                        <th>Duración</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="turnosTableBody">
                    <tr><td colspan="9" class="text-center py-4">Cargando turnos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login.html';
        }
        
        document.getElementById('adminName').textContent = localStorage.getItem('adminUser') || 'Admin';

        let allTurnos = [];
        let currentBarberoFilter = 'todos';

        async function loadTurnos() {
            try {
                const response = await fetch('/api/turnos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    allTurnos = data.data;
                    renderTable();
                    updateStats();
                } else if (response.status === 401 || response.status === 403) {
                    logout();
                }
            } catch (error) {
                showAlert('Error al cargar turnos', 'danger');
            }
        }

        function renderTable(searchQuery = '') {
            const tbody = document.getElementById('turnosTableBody');
            tbody.innerHTML = '';
            
            const filtered = allTurnos.filter(t => {
                const matchesSearch = t.cliente.toLowerCase().includes(searchQuery) || 
                                    (t.telefono && t.telefono.includes(searchQuery));
                const matchesBarbero = currentBarberoFilter === 'todos' || 
                                     (t.barbero && t.barbero.toLowerCase() === currentBarberoFilter);
                return matchesSearch && matchesBarbero;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4">No se encontraron turnos.</td></tr>';
                return;
            }

            filtered.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="d-none">${t.id}</td>
                    <td>${t.fecha}</td>
                    <td>${t.hora.substring(0, 5)}</td>
                    <td>${t.cliente}</td>
                    <td>${t.telefono || '-'}</td>
                    <td>${t.servicio}</td>
                    <td>${t.barbero || '-'}</td>
                    <td>${t.pago || '-'}</td>
                    <td>${t.duracionMinutos > 0 ? t.duracionMinutos + ' min' : '-'}</td>
                    <td>
                        <button onclick="eliminarTurno(${t.id})" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allTurnos.length;
            
            const hoyDate = new Date();
            const hoyStr = hoyDate.toISOString().split('T')[0];
            const hoyCount = allTurnos.filter(t => t.fecha === hoyStr).length;
            document.getElementById('statHoy').textContent = hoyCount;
            
            const efectivoCount = allTurnos.filter(t => t.pago === 'efectivo').length;
            document.getElementById('statEfectivo').textContent = efectivoCount;
        }

        async function eliminarTurno(id) {
            if (!confirm('¿Seguro que deseas eliminar este turno?')) return;
            
            try {
                const response = await fetch(`/api/turnos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Turno eliminado correctamente', 'success');
                    loadTurnos();
                } else {
                    showAlert(data.message, 'danger');
                }
            } catch (error) {
                showAlert('Error al eliminar turno', 'danger');
            }
        }

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alertMsg');
            alertDiv.textContent = msg;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.classList.remove('d-none');
            setTimeout(() => alertDiv.classList.add('d-none'), 3000);
        }

        function filtrarPorBarbero(barbero, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active', 'btn-success');
                b.classList.add('btn-outline-success');
            });
            btn.classList.remove('btn-outline-success');
            btn.classList.add('active', 'btn-success');
            
            currentBarberoFilter = barbero;
            renderTable(document.getElementById('searchInput').value.toLowerCase().trim());
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(e.target.value.toLowerCase().trim());
        });

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/login.html';
        }

        // Init
        loadTurnos();
    </script>
</body>
</html>
