<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background: #1f5e2cff; margin: 0; padding: 20px; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-number { font-size: 32px; font-weight: bold; color: #4CAF50; }
        .stat-label { color: #999; font-size: 14px; margin-top: 5px; }
        .table-wrapper { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
        th { background: #030000ff; color: white; padding: 12px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="m-0 fs-4">🏪 Panel Administrativo - Turnos</h1>
                <div class="text-light" style="font-size: 14px;">Bienvenido, <strong id="adminName">Admin</strong></div>
            </div>
            <button onclick="logout()" class="btn btn-danger">Cerrar Sesión</button>
        </div>
        
        <div id="alertMsg" class="alert d-none" role="alert"></div>
        
        <!-- Estadísticas -->
        <div class="row g-3 mb-4" id="statsContainer">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Total de Turnos</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statHoy">0</div>
                    <div class="stat-label">Turnos Hoy</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" id="statEfectivo">0</div>
                    <div class="stat-label">Pagos en Efectivo</div>
                </div>
            </div>
        </div>
        
        <!-- Toolbar -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <input type="search" id="searchInput" class="form-control w-auto flex-grow-1" placeholder="🔍 Buscar por nombre o teléfono...">
            <button class="btn btn-secondary" onclick="loadTurnos()">🔄 Refrescar</button>
        </div>
        
        <!-- Filtros de barbero -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-outline-success active filter-btn" onclick="filtrarPorBarbero('todos', this)">Todos</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('samuel', this)">Samuel</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('ale', this)">Ale</button>
            <button class="btn btn-outline-success filter-btn" onclick="filtrarPorBarbero('alexis', this)">Alexis</button>
        </div>
        
        <!-- Tabla de turnos -->
        <div class="table-wrapper">
            <table class="table table-striped table-hover mb-0">
                <thead>
                    <tr>
                        <th class="d-none">ID</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Servicio</th>
                        <th>Barbero</th>
                        <th>Pago</th>
                        <th>Duración</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="turnosTableBody">
                    <tr><td colspan="9" class="text-center py-4">Cargando turnos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login.html';
        }
        
        document.getElementById('adminName').textContent = localStorage.getItem('adminUser') || 'Admin';

        let allTurnos = [];
        let currentBarberoFilter = 'todos';

        async function loadTurnos() {
            try {
                const response = await fetch('/api/turnos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    allTurnos = data.data;
                    renderTable();
                    updateStats();
                } else if (response.status === 401 || response.status === 403) {
                    logout();
                }
            } catch (error) {
                showAlert('Error al cargar turnos', 'danger');
            }
        }

        function renderTable(searchQuery = '') {
            const tbody = document.getElementById('turnosTableBody');
            tbody.innerHTML = '';
            
            const filtered = allTurnos.filter(t => {
                const matchesSearch = t.cliente.toLowerCase().includes(searchQuery) || 
                                    (t.telefono && t.telefono.includes(searchQuery));
                const matchesBarbero = currentBarberoFilter === 'todos' || 
                                     (t.barbero && t.barbero.toLowerCase() === currentBarberoFilter);
                return matchesSearch && matchesBarbero;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4">No se encontraron turnos.</td></tr>';
                return;
            }

            filtered.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="d-none">${t.id}</td>
                    <td>${t.fecha}</td>
                    <td>${t.hora.substring(0, 5)}</td>
                    <td>${t.cliente}</td>
                    <td>${t.telefono || '-'}</td>
                    <td>${t.servicio}</td>
                    <td>${t.barbero || '-'}</td>
                    <td>${t.pago || '-'}</td>
                    <td>${t.duracionMinutos > 0 ? t.duracionMinutos + ' min' : '-'}</td>
                    <td>
                        <button onclick="eliminarTurno(${t.id})" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allTurnos.length;
            
            const hoyDate = new Date();
            const hoyStr = hoyDate.toISOString().split('T')[0];
            const hoyCount = allTurnos.filter(t => t.fecha === hoyStr).length;
            document.getElementById('statHoy').textContent = hoyCount;
            
            const efectivoCount = allTurnos.filter(t => t.pago === 'efectivo').length;
            document.getElementById('statEfectivo').textContent = efectivoCount;
        }

        async function eliminarTurno(id) {
            if (!confirm('¿Seguro que deseas eliminar este turno?')) return;
            
            try {
                const response = await fetch(`/api/turnos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Turno eliminado correctamente', 'success');
                    loadTurnos();
                } else {
                    showAlert(data.message, 'danger');
                }
            } catch (error) {
                showAlert('Error al eliminar turno', 'danger');
            }
        }

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alertMsg');
            alertDiv.textContent = msg;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.classList.remove('d-none');
            setTimeout(() => alertDiv.classList.add('d-none'), 3000);
        }

        function filtrarPorBarbero(barbero, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active', 'btn-success');
                b.classList.add('btn-outline-success');
            });
            btn.classList.remove('btn-outline-success');
            btn.classList.add('active', 'btn-success');
            
            currentBarberoFilter = barbero;
            renderTable(document.getElementById('searchInput').value.toLowerCase().trim());
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(e.target.value.toLowerCase().trim());
        });

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/login.html';
        }

        // Init
        loadTurnos();
    </script>
</body>
</html>
