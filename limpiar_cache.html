<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Cache - BUNKER Barber</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ffbc0e;
            margin-bottom: 20px;
        }
        button {
            background: #ffbc0e;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #ffa500;
            transform: scale(1.05);
        }
        .success {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        a {
            color: #ffbc0e;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiar Cache del Navegador</h1>
        <p>Si estás experimentando problemas con turnos fantasma o reservas antiguas,<br>haz clic en el botón para limpiar el cache local.</p>
        
        <button onclick="limpiarCache()">Limpiar Cache Ahora</button>
        
        <div id="success" class="success">
            ✅ Cache limpiado exitosamente!<br>
            Puedes volver a la página principal.
        </div>
        
        <br><br>
        <a href="index.php">← Volver a la página principal</a>
    </div>

    <script>
        function limpiarCache() {
            // Limpiar localStorage
            localStorage.removeItem('bunkerBarberReservas');
            localStorage.clear();
            
            // Mostrar mensaje de éxito
            document.getElementById('success').style.display = 'block';
        }
    </script>
</body>
</html>
