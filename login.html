<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Panel Administrativo</title>
    <link rel="stylesheet" href="../proyecto-barber/style.css" />
    <style>
      /* Small adjustments to blend with main theme */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #0a0e13, #0f1419);
      }
      .card {
        background: linear-gradient(135deg, var(--bg-dark), #0d1419);
        padding: 28px;
        border-radius: 12px;
        border: 1px solid var(--accent-blue);
        width: 380px;
        box-shadow: 0 20px 50px rgba(22, 48, 43, 0.6);
      }
      h2 {
        color: var(--accent-copper);
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--accent-blue);
        border-radius: 8px;
        margin-top: 6px;
        background: rgba(15, 20, 25, 0.7);
        color: var(--text-primary);
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--accent-copper);
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-blue)
        );
        color: var(--accent-copper);
        cursor: pointer;
        font-weight: 700;
      }
      .note {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Acceso al Panel Administrativo</h2>
      <form id="loginForm">
        <label for="user">Usuario</label>
        <input id="user" name="user" autocomplete="username" required />
        <label for="pass">Contraseña</label>
        <input
          id="pass"
          name="pass"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Iniciar sesión</button>
      </form>
      <div class="note">
        Si es la primera vez, las credenciales por defecto son
        <strong>admin / admin123</strong>. Cámbialas desde el panel.
      </div>
    </div>

    <script>
      const CRED_KEY = "bunkerBarberAdminCreds";

      async function hashString(str) {
        const enc = new TextEncoder().encode(str);
        const buf = await crypto.subtle.digest("SHA-256", enc);
        return Array.from(new Uint8Array(buf))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function ensureCreds() {
        const raw = localStorage.getItem(CRED_KEY);
        if (raw) return JSON.parse(raw);
        const user = "admin";
        const pass = "admin123";
        const ph = await hashString(pass);
        const creds = { user, passHash: ph };
        localStorage.setItem(CRED_KEY, JSON.stringify(creds));
        return creds;
      }

      async function login(e) {
        e.preventDefault();
        const user = document.getElementById("user").value.trim();
        const pass = document.getElementById("pass").value;
        if (!user || !pass) return alert("Completa usuario y contraseña");
        const creds = await ensureCreds();
        const ph = await hashString(pass);
        if (user === creds.user && ph === creds.passHash) {
          sessionStorage.setItem("adminLoggedIn", "1");
          sessionStorage.setItem("adminUser", user);
          window.location.href = "admin.html";
        } else {
          alert("Usuario o contraseña incorrectos");
        }
      }

      document.getElementById("loginForm").addEventListener("submit", login);
    </script>
  </body>
</html>
